name: Test, build and publish Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Helper script must stay Python 3.6 compatible (syntax check)
        run: |
          python - <<'EOF'
          import ast, sys
          src = open("helper/pleskmcp_helper.py").read()
          tree = ast.parse(src, feature_version=(3, 6))
          banned = {"JoinedStr": "f-string", "NamedExpr": "walrus"}
          for node in ast.walk(tree):
              if type(node).__name__ in banned:
                  sys.exit(f"helper uses a {banned[type(node).__name__]} (not Python 3.6 compatible)")
          assert "from __future__ import annotations" not in src
          EOF
      - name: Tests (as the unprivileged runner user)
        run: python -m pytest -q

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          base=$(sed -n 's/^_VERSION_BASE = "\(.*\)"$/\1/p' pleskmcp/__init__.py)
          count=$(git rev-list --count HEAD -- pleskmcp helper Dockerfile pyproject.toml)
          test -n "$base" && test -n "$count"
          echo "version=${base}.${count}" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
