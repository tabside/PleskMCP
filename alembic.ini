[alembic]
script_location = pleskmcp/migrations
prepend_sys_path = .
# DATABASE_URL from the environment is used by env.py; this value is a placeholder.
sqlalchemy.url = postgresql+asyncpg://user:password@postgres/pleskmcp

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
