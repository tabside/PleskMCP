[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pleskmcp"
description = "Remote MCP server that lets Plesk hosting customers edit the files of their own subscriptions with AI tools (Claude, ChatGPT, ...)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = [
    "mcp>=2.3.0,<3.0.0",
    "starlette>=0.47",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "asyncssh>=2.14",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "fakeredis[lua]>=2.23", "aiosqlite>=0.20", "pyflakes>=3"]

[project.scripts]
pleskmcp = "pleskmcp.cli:main"

[tool.setuptools]
packages = ["pleskmcp", "pleskmcp.auth", "pleskmcp.migrations", "pleskmcp.migrations.versions", "pleskmcp.signup", "pleskmcp.signup.templates"]

[tool.setuptools.package-data]
"pleskmcp.signup" = ["data/*.json"]
"pleskmcp.signup.templates" = ["*.txt"]

[tool.setuptools.dynamic]
version = { attr = "pleskmcp.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
